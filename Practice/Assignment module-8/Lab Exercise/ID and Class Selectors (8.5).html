<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ID and Class Assignment</title>
    <style>
        /* 1. ID Selector (starts with #) */
        /* Used only ONCE per page for a unique element */
        #main-header {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 40px;
            text-align: center;
            border-bottom: 5px solid #e74c3c;
        }

        /* 2. Class Selector (starts with .) */
        /* Applied to MULTIPLE elements for a consistent look */
        .feature-box {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            margin: 15px;
            border-radius: 8px;
            width: 200px;
            display: inline-block;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            vertical-align: top;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>My Personal Dashboard</h1>
        <p>Styled with a unique ID selector</p>
    </header>

    <div style="text-align: center; margin-top: 30px;">
        <div class="feature-box">
            <h3>Profile</h3>
            <p>This box uses the "feature-box" class.</p>
        </div>

        <div class="feature-box">
            <h3>Settings</h3>
            <p>This box also uses the same class.</p>
        </div>

        <div class="feature-box">
            <h3>Messages</h3>
            <p>Consistently styled with the same class.</p>
        </div>
    </div>

</body>
</html>
