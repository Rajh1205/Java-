<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f2f2f2;
        font-family: Arial, sans-serif;
    }

    .form-box {
        width: 350px;
        padding: 20px;
        border: 2px solid #333;
        border-radius: 8px;
        background-color: #fff;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
    }

    p {
        margin: 10px 0;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
        width: 100%;
        padding: 5px;
    }

    .btn {
        width: 48%;
        padding: 6px;
    }
</style>
</head>
<body>

 <form action="">
 <p>
 Enter Name:<input type="text" name="Enter Name">
 </p>
 
 <p>
 Enter Email:<input type="text" name="Enter Emial">
 </p>
 
 <p>
 Enter Password:<input type="password" name="Enter Password">
 </p>
 
 <p>
 Enter Mobile:<input type="number" name="Enter Mobile">
 </p>
 
 <p>
 Select Hobbies:
 <input type="checkbox" name="Cricket" value="Cricket">Cricket
 <input type="checkbox" name="Foot-Ball" value="Foot-Ball">Foot-Ball
 </p>
 
 <p>
 Select Gender:
 <input type="radio" name="Gender" value="Male">Male
 <input type="radio" name="Gender" value="Female">Female
 </p>
 
 <p>
 Select City:
 <select>
 <option>Rajkot</option>
 <option>Surat</option>
 <option>Jamnagar</option>
 </select>
 
 <p>
 <input type="reset" name="Reset" value="Reset">
 <input type="submit" name="submit" value="Submit">
 </p>
 
 </form>

</body>
</html>
