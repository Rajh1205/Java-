<!DOCTYPE html>
<html>
<head>
    <title>HTTP Methods Demo</title>
</head>
<body>
    <h1>HTTP Request Tester</h1>

    <h3>Test GET Request:</h3>
    <a href="ProcessRequest">Click here to send a GET request</a>

    <hr>

    <h3>Test POST Request:</h3>
    <form action="ProcessRequest" method="POST">
        <label>Enter Name: </label>
        <input type="text" name="username" required>
        <input type="submit" value="Submit via POST">
    </form>
</body>
</html>
