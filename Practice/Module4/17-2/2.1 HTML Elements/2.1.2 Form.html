<!DOCTYPE html>
<html>
<head>
	<title>Form</title>
	<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f2f2f2;
        font-family: Arial, sans-serif;
    }

    .form-box {
        width: 350px;
        padding: 20px;
        border: 2px solid #333;
        border-radius: 8px;
        background-color: #fff;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
    }

    p {
        margin: 10px 0;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
        width: 100%;
        padding: 5px;
    }

    .btn {
        width: 48%;
        padding: 6px;
    }
</style>
</head>
<body>
<!-- form is use for registration/login/contact process -->
<form method="post">
<table >

	<tr>
    	<td>Name</td>
        <td><input type="text" name="txt"/></td>
        
    </tr>
    
	<tr>
    	<td>Password</td>
        <td><input type="password" name="pass"/></td>
        
    </tr>
    
	<tr>
    	<td>Gender</td>
        <td><input type="radio" name="gen" value="male"/>Male
        	<input type="radio" name="gen" value="female"/>Female
        </td>
        
    </tr>
    <tr>
    	<td>Hobby</td>
        <td><input type="checkbox" name="hb" value="read"/>Read
        	<input type="checkbox" name="hb" value="write"/>write
        </td>
        
    </tr>
   
	<tr>
    	<td>Address</td>
        <td><textarea></textarea></td>
        
    </tr>
    <tr>
    	<td>City</td>
        <td>
        	<select>
            	<option>Select  City</option>
                <option>Ahmedabad</option>
                <option>Surat</option>
            </select>
            
        </td>
        
    </tr>
    <tr>
    	<td>Upload</td>
        <td><input type="file" name="file"/></td>
        
    </tr>
   
   <tr>
        <td><input type="submit" name="login"/></td>
        
    </tr>
   
   

</table>
</form>
</body>
</html>
